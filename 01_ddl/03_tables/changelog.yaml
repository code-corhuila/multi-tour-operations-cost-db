  - changeSet:
      id: operations-cost-ddl-tables-004
      author: Molina211
      labels: "HU-OPS-002,ddl,tables"
      comment: "A vehicle of a tenant: a name and a capacity from 1 to 100 seats. It is never deleted (spec AC-DB-02.1, AC-DB-02.3)."
