databaseChangeLog:
  - changeSet:
      id: operations-cost-dcl-grants-001
      author: Molina211
      labels: "HU-OPS-001,dcl,grants"
      comment: "The writer never deletes: a departure is cancelled, never erased (spec AC-DB-01.6, plan D-06)."
      changes:
        - sqlFile:
            path: 001_grants.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/001_grants.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false

  - changeSet:
      id: operations-cost-dcl-grants-002
      author: Molina211
      labels: "HU-OPS-007,dcl,grants"
      comment: "A cost is never rewritten: the writer loses UPDATE on it (spec 006, plan D-07)."
      changes:
        - sqlFile:
            path: 002_revoke_cost_update.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/002_revoke_cost_update.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false

  - changeSet:
      id: operations-cost-dcl-grants-003
      author: Molina211
      labels: "HU-OPS-002,dcl,grants"
      comment: "The writer may delete the assignment of a vehicle to a departure, and nothing else (api spec 008)."
      changes:
        - sqlFile:
            path: 003_grant_delete_vehicle_assignment.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
