databaseChangeLog:
  - changeSet:
      id: operations-cost-ddl-alter-001
      author: Molina211
      labels: "HU-OPS-001,ddl,alter"
      comment: "A key belongs to the departure it created and that departure cannot disappear from under it (RESTRICT, plan D-05)."
      changes:
        - sqlFile:
            path: 001_add_idempotency_key_salida_foreign_key.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/001_add_idempotency_key_salida_foreign_key.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false

  - changeSet:
      id: operations-cost-ddl-alter-002
      author: Molina211
      labels: "HU-OPS-002,ddl,alter"
      comment: "The assignment joins a vehicle and a departure of the same tenant, and neither can disappear from under it (spec AC-DB-02.5)."
      changes:
        - sqlFile:
            path: 002_add_vehicle_and_salida_vehicle_keys.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/002_add_vehicle_and_salida_vehicle_keys.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
