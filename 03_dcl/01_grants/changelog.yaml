            stripComments: false

  - changeSet:
      id: operations-cost-dcl-grants-005
      author: Molina211
      labels: "HU-OPS-008,dcl,grants"
      comment: "A personal emergency is never rewritten: the writer loses UPDATE on it (spec 009)."
      changes:
        - sqlFile:
            path: 005_revoke_personal_emergency_update.sql
