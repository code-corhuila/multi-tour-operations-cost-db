databaseChangeLog:
  - changeSet:
      id: operations-cost-ddl-tables-001
      author: Molina211
      labels: "HU-OPS-001,ddl,tables"
      comment: "The departure: a tour that really happens on a date. It is cancelled, never erased (spec AC-DB-01.2 to AC-DB-01.6)."
      changes:
        - sqlFile:
            path: 001_create_salida.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/001_create_salida.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false

  - changeSet:
      id: operations-cost-ddl-tables-002
      author: Molina211
      labels: "HU-OPS-001,ddl,tables"
      comment: "The outbox of the events this service publishes, written in the same transaction as the change (ADR-004 D4)."
      changes:
